spec:
  name: fashionstore-backend
  services:
    - name: backend
      github:
        repo: YOUR_GITHUB_USERNAME/ecommerce-SI2
        branch: main
        repo_clone_url: https://github.com/YOUR_GITHUB_USERNAME/ecommerce-SI2.git
      envs:
        - key: DATABASE_URL
          scope: RUN_AND_BUILD_TIME
          value: "postgresql+psycopg2://neondb_owner:npg_4NnHEasV9QzO@ep-little-base-b5ckb41q-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      dockerfile_path: ./backend/Dockerfile
      run_command: uvicorn main:app --host 0.0.0.0 --port 8000
      http_port: 8000
      routes:
        - path: /
          protocol: http
      health_check:
        http_path: /health
        initial_delay_seconds: 10
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 3
  region: nyc3
  static_sites: []
