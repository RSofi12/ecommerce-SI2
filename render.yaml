services:
  - type: web
    name: fashionstore-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && python -m seed && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: DATABASE_URL
        value: "postgresql+psycopg2://neondb_owner:npg_4NnHEasV9QzO@ep-little-base-b5ckb41q-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: SECRET_KEY
        value: "supersecretkey1234567890"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALGORITHM
        value: "HS256"
      - key: CLOUDINARY_CLOUD_NAME
        value: "your_cloud_name"
      - key: CLOUDINARY_API_KEY
        value: "your_api_key"
      - key: CLOUDINARY_API_SECRET
        value: "your_api_secret"
      - key: CLOUDINARY_FOLDER
        value: "fashionstore"
      - key: STRIPE_SECRET_KEY
        value: "your_stripe_secret_key"
      - key: STRIPE_WEBHOOK_SECRET
        value: "your_stripe_webhook_secret"
      - key: STRIPE_PUBLISHABLE_KEY
        value: "your_stripe_publishable_key"
      - key: STRIPE_CURRENCY
        value: "usd"
      - key: GEMINI_API_KEY
        value: "your-gemini-api-key"
      - key: GEMINI_MODEL
        value: "gemini-3.6-flash"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: "./.secrets/firebase-service-account.json"
    autoDeploy: true
    healthCheckPath: /health
    plan: free
    region: oregon

  - type: web
    name: fashionstore-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: API_BASE_URL
        value: "https://ecommerce-si2.onrender.com/api"
      - key: RENDER
        value: "true"
